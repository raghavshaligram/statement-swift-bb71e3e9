# PayPal one-time lifetime checkout (Orders API, not the old removed
# Subscriptions API -- see the 20260805 migration and each function's own
# comment for why).
#
# All four run with verify_jwt = false. The platform gateway's own JWT
# check rejected valid user sessions outright (401 "Unauthorized" before
# the function ever booted) once this project moved to asymmetric signing
# keys, so create-order/capture-order do the auth check themselves:
# each validates the caller's Authorization bearer via
# supabase.auth.getUser(token) and refuses the request without a real
# user. The webhook is called by PayPal's servers, which cannot supply a
# Supabase JWT at all, and verifies PayPal's own signature instead.

[functions.paypal-config]
verify_jwt = false

[functions.paypal-create-order]
verify_jwt = false

[functions.paypal-capture-order]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false
