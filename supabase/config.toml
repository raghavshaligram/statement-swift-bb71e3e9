# PayPal one-time lifetime checkout (Orders API, not the old removed
# Subscriptions API -- see the 20260805 migration and each function's own
# comment for why). Two functions are invoked from the browser via
# supabase.functions.invoke, carrying the user's own Supabase JWT, and stay
# on the platform default (verify_jwt = true). The webhook is called by
# PayPal's own servers, which cannot supply a Supabase JWT at all -- it
# must be verify_jwt = false, with its own signature verification against
# PayPal's API standing in as the real auth check (see that function).

[functions.paypal-config]
verify_jwt = false

[functions.paypal-create-order]
verify_jwt = true

[functions.paypal-capture-order]
verify_jwt = true

[functions.paypal-webhook]
verify_jwt = false
