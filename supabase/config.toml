# The four PayPal functions (paypal-webhook, paypal-create-plan,
# paypal-config, paypal-record-subscription) were removed along with the rest
# of the PayPal integration.
#
# Worth carrying forward when a processor is next wired up: a webhook called by
# the processor's servers CANNOT supply a Supabase JWT, so it needs
# `verify_jwt = false` plus its own signature verification against the
# processor's API. Functions invoked from the browser via
# supabase.functions.invoke should stay on the default `verify_jwt = true`.
